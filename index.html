<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ops-Sentinel | Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass: rgba(15, 23, 42, 0.8);
            --border: rgba(255, 255, 255, 0.08);
        }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }
        
        .incident-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .incident-card::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
            background: #3b82f6; opacity: 0.5;
        }
        .incident-card:hover { border-color: rgba(59, 130, 246, 0.4); transform: translateY(-2px); }

        .log-viewport {
            scrollbar-width: thin;
            scrollbar-color: #334155 transparent;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: scale(0.98) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-incident { animation: slideIn 0.4s ease-out forwards; }
        
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    </style>
</head>
<body class="text-slate-300 antialiased selection:bg-blue-500/30">

    <nav class="sticky top-0 z-50 glass-panel border-b border-white/5 px-6 py-4 mb-10">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-indigo-700 rounded-xl flex items-center justify-center shadow-lg shadow-blue-900/20">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04m18.517 3.48c.063.62.095 1.25.095 1.887 0 5.614-2.82 10.645-7.5 13.435-4.68-2.79-7.5-7.821-7.5-13.435 0-.637.032-1.267.095-1.887a11.983 11.983 0 0014.823 0z"></path></svg>
                </div>
                <div>
                    <h1 class="text-white font-extrabold tracking-tight text-xl leading-none">OPS<span class="text-blue-500">SENTINEL</span></h1>
                    <span class="text-[10px] uppercase tracking-[0.2em] font-semibold text-slate-500">Autonomous Defense Layer</span>
                </div>
            </div>

            <div class="flex items-center gap-8">
                <div class="hidden md:flex gap-6 border-r border-white/10 pr-8">
                    <div class="text-right">
                        <p class="text-[9px] uppercase font-bold text-slate-500 tracking-wider">Analysis Lag</p>
                        <p id="backlog-count" class="mono text-xl font-medium text-amber-500">0ms</p>
                    </div>
                </div>
                <div id="status-container" class="flex items-center gap-3 bg-slate-900/50 px-4 py-2 rounded-full border border-white/5">
                    <div id="status-dot" class="status-dot bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.5)]"></div>
                    <span id="status-text" class="text-[11px] font-bold uppercase tracking-widest text-slate-400">Offline</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6">
        <header class="mb-8">
            <h2 class="text-slate-100 font-semibold text-lg flex items-center gap-2">
                <span class="w-1.5 h-4 bg-blue-500 rounded-full"></span>
                Incident Activity Log
            </h2>
        </header>

        <div id="incident-container" class="space-y-6 pb-20">
            <div id="empty-state" class="glass-panel rounded-2xl p-20 text-center border-dashed border-2 border-white/5">
                <div class="inline-flex w-16 h-16 bg-slate-800/50 rounded-full items-center justify-center mb-4 text-slate-600">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <h3 class="text-slate-400 font-medium">Monitoring Redis Stream</h3>
                <p class="text-slate-600 text-sm mt-1">No anomalies detected in the last cycle.</p>
            </div>
        </div>
    </main>

    <script>
        const container = document.getElementById('incident-container');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const backlogCounter = document.getElementById('backlog-count');

        const eventSource = new EventSource('http://localhost:3001/stream');

        eventSource.onopen = () => {
            statusDot.className = "status-dot bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.5)] animate-pulse";
            statusText.innerText = "Monitoring Live";
            statusText.classList.remove('text-slate-400', 'text-red-500');
            statusText.classList.add('text-emerald-500');
        };

        eventSource.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.backlog !== undefined) {
                backlogCounter.innerText = `${data.backlog} LOGS`;
                backlogCounter.className = data.backlog > 50 ? "mono text-xl font-medium text-red-500" : "mono text-xl font-medium text-amber-500";
            }
            if (data.type === 'LIVE_INCIDENT' || data.type === 'MANUAL_RESOLUTION') {
                const emptyState = document.getElementById('empty-state');
                if (emptyState) emptyState.remove();
                renderIncident(data);
            }
        };

        eventSource.onerror = () => {
            statusDot.className = "status-dot bg-red-500 shadow-[0_0_10px_rgba(239,68,68,0.5)]";
            statusText.innerText = "Disconnected";
            statusText.classList.remove('text-emerald-500', 'text-slate-400');
            statusText.classList.add('text-red-500');
        };

        // FEEDBACK HANDLER: Communicates with backend to promote solutions to Supabase
async function handleFeedback(isApproved, buttonElement, solutionData) {
    const card = buttonElement.closest('.incident-card');
    if (!isApproved) { card.remove(); return; }

    try {
        await fetch('http://localhost:3001/approve-solution', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                solution: solutionData.solution,
                tags: solutionData.tags,
                // CRUCIAL: Send the logs that caused the problem
                forensicStory: solutionData.forensicStory 
            })
        });

                if (response.ok) {
                    // Update UI to show success
                    const controls = card.querySelector('.feedback-controls');
                    controls.innerHTML = `
                        <span class="flex items-center gap-1 text-[10px] font-bold uppercase text-emerald-500 bg-emerald-500/10 px-3 py-1 rounded border border-emerald-500/20">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                            Promoted to KB
                        </span>
                    `;
                }
            } catch (err) { console.error(err); }
        }

        function renderIncident(data) {
            const tags = data.tags || [];
            const story = data.forensicStory || [];
            const sources = data.sources || [];
            const solution = data.solution || 'No resolution provided.';

            // Determine if this came from Active Retrieval (External)
            const isExternal = tags.includes('external-web');

            const card = document.createElement('div');
            card.className = "incident-card glass-panel rounded-2xl animate-incident";
            
            const tagsHtml = tags.map(t => `<span class="px-2 py-0.5 rounded-md bg-blue-500/10 text-blue-400 text-[10px] font-bold border border-blue-500/20 uppercase tracking-tighter">#${t}</span>`).join('');
            const logsHtml = story.map(l => `<div class="mono text-[11px] py-1 border-b border-white/5 last:border-0 text-slate-500 hover:text-slate-300 transition-colors">${l}</div>`).join('');

            // Serialize data for the click handler
            const safeData = JSON.stringify(data).replace(/'/g, "&apos;").replace(/"/g, "&quot;");

            card.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-12">
                    <div class="lg:col-span-4 p-6 border-b lg:border-b-0 lg:border-r border-white/5 bg-white/[0.02]">
                        <div class="flex items-center justify-between mb-6">
                            <span class="text-[10px] font-extrabold uppercase tracking-widest text-blue-500">Forensic Chain</span>
                            <span class="text-[10px] font-medium text-slate-500 mono">${new Date().toLocaleTimeString()}</span>
                        </div>
                        <div class="log-viewport h-[320px] overflow-y-auto pr-2">
                            ${logsHtml}
                        </div>
                    </div>

                    <div class="lg:col-span-8 p-8 flex flex-col justify-between">
                        <div>
                            <div class="flex items-start justify-between mb-6">
                                <div>
                                    <h4 class="text-white font-bold text-lg leading-tight">
                                        ${isExternal ? 'External Insight Retrieved' : 'Automated Resolution Applied'}
                                    </h4>
                                    <p class="text-slate-500 text-xs mt-1">Grounding: ${sources.join(', ') || 'Global Intelligence'}</p>
                                </div>
                                <div class="bg-blue-500/10 p-2 rounded-lg">
                                    <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                                </div>
                            </div>
                            
                            <div class="bg-slate-900/80 rounded-xl p-6 border border-white/5 relative group">
                                <div class="absolute -top-3 left-4 px-2 bg-slate-900 text-[10px] font-bold text-slate-400 uppercase tracking-widest border border-white/5">Recovery Playbook</div>
                                <div class="text-slate-300 text-sm leading-relaxed">
                                    ${solution.replace(/\n/g, '<br>')}
                                </div>
                            </div>
                        </div>

                        <div class="mt-8 flex items-center justify-between">
                            <div class="flex gap-2">${tagsHtml}</div>
                            
                            <div class="feedback-controls flex items-center gap-3">
                                ${isExternal ? `
                                    <button onclick='handleFeedback(true, this, ${safeData})' 
                                            class="px-3 py-1.5 bg-emerald-500/10 text-emerald-500 border border-emerald-500/20 rounded text-[10px] font-bold uppercase tracking-wider hover:bg-emerald-500/20 transition-all">
                                        Approve & Save
                                    </button>
                                    <button onclick='handleFeedback(false, this, null)' 
                                            class="px-3 py-1.5 bg-red-500/10 text-red-500 border border-red-500/20 rounded text-[10px] font-bold uppercase tracking-wider hover:bg-red-500/20 transition-all">
                                        Reject
                                    </button>
                                ` : `
                                    <button class="text-[10px] font-bold uppercase tracking-widest text-slate-500 hover:text-white transition-colors flex items-center gap-2">
                                        Export Logs
                                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                                    </button>
                                `}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            container.prepend(card);
        }
    </script>
</body>
</html>
